# Keep https when a proxy in front (Tailscale serve) already terminated TLS.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Compress text: the app's JavaScript shrinks to about a third, and API JSON a lot more.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/problem+json
    application/manifest+json image/svg+xml text/plain;

  # Docker's DNS, so a restarted api container is found at its new address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;

  # Reading a message with a local model can take a while on a busy laptop.
  location = /api/parse {
    proxy_pass $api;
    proxy_read_timeout 180s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # API, OpenAPI JSON and Swagger UI go to Spring Boot.
  location ~ ^/(api|swagger-ui)(/|$) {
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Built files have content hashes in their names, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The service worker and manifest must not be cached long, or updates never reach phones.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Client-side routes. index.html is never cached, so a new build shows up on next open.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri /index.html;
  }
}
