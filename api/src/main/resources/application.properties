spring.application.name=training-journal-api

# MongoDB. Local default is a plain mongod on localhost (docker compose starts one).
# For Atlas, set SPRING_DATA_MONGODB_URI, or put spring.data.mongodb.uri=... in a
# gitignored application-secrets.properties next to this file (see README).
spring.config.import=optional:classpath:application-secrets.properties
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:FitnessTracker}
spring.data.mongodb.auto-index-creation=true

# Load synthetic demo entries on startup when the journal is empty.
app.demo-data=${DEMO_DATA:false}

spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi
