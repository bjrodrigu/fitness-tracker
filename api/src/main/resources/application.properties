spring.application.name=training-journal-api

# MongoDB. Local default is a plain mongod on localhost (docker compose starts one).
# For Atlas, set SPRING_DATA_MONGODB_URI, or put spring.data.mongodb.uri=... in a
# gitignored application-secrets.properties next to this file (see README).
spring.config.import=optional:classpath:application-secrets.properties
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:FitnessTracker}
spring.data.mongodb.auto-index-creation=true

# Load synthetic demo entries on startup when the journal is empty.
app.demo-data=${DEMO_DATA:false}

spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/api/openapi

# Sign-in sessions are kept in MongoDB for 30 days, so a phone stays signed in.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
spring.session.mongodb.collection-name=sessions
# Behind nginx (and Tailscale serve), trust X-Forwarded-* for https and the client address.
server.forward-headers-strategy=native

# Garmin sync. GARMIN_TOKEN_KEY (32 random bytes, base64) encrypts saved Garmin tokens;
# without it, linking a Garmin account is turned off.
app.garmin.token-key=${GARMIN_TOKEN_KEY:}
app.garmin.sync-url=${GARMIN_SYNC_URL:http://garmin-sync:8000}
app.garmin.sync-every=${GARMIN_SYNC_EVERY:PT6H}

# Food search. A free key from https://api.data.gov/signup turns on USDA search properly;
# without it USDA allows only a handful of searches an hour and Open Food Facts carries the load.
app.foods.usda-key=${FDC_API_KEY:}
app.foods.off-country=${FOOD_COUNTRY:united-states}
