name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Unit tests plus API tests against MongoDB in Docker (Testcontainers).
      - run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  loader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - name: Demo sign-in and data are served through nginx
        run: |
          J=/tmp/cookies
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/stats)" = 401
          curl -fsS -c $J http://localhost:4000/api/auth/config | grep -q '"demo":true'
          TOKEN=$(awk '$6 == "XSRF-TOKEN" {print $7}' $J)
          curl -fsS -b $J -c $J -X POST -H "X-XSRF-TOKEN: $TOKEN" http://localhost:4000/api/auth/demo
          curl -fsS -b $J http://localhost:4000/api/stats | python3 -c "import json,sys; d=json.load(sys.stdin); assert any(w['runs'] > 0 for w in d['weeks']), d['weeks']"
          curl -fsS http://localhost:4000/journal | grep -q '<div id="root">'
          curl -fsS http://localhost:4000/manifest.webmanifest | grep -q '"standalone"'
      - if: always()
        run: docker compose logs --no-color | tail -100
